# Wildfire Simulator Configuration

# Time step size (fraction of max_t per step)
# Examples: "1/48" gives 48 steps, "1/8" gives 8 steps
dt: "1/8"

# Maximum simulation time (normalized)
max_t: 1.0

# Optimizer learning rate.
lr: 5.0e-4

# Scheduled sampling parameters
# k: steepness of sigmoid transition
# t0: epoch at which probability = 50%
scheduled_sampling:
  k: 0.1
  t0: 30

# Training scenes. Each scene is one landscape with its own trials and
# ignitions. Relative paths are resolved against this config file's directory.
# A single-scene list reproduces the original stage-1 behavior.
scenes:
  - landscape: FlamMapData/classic-palisades/palisades.tif
    trials: FlamMapData/classic-palisades/Trials/
    ignitions: FlamMapData/classic-palisades/Ignitions/
